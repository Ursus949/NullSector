[package]
name = "nullsector"
default-run = "nullsector"
version = "0.3.0"
authors = ["Ursus949"]
edition = "2024"
license = "MIT"
description = "A desktop GUI for common networking and security tools."
repository = "https://github.com/Ursus949/NullSector"

[[bin]]
name = "nullsector"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
egui = "0.36.1"
eframe = { version = "0.36.1", features = ["persistence"] }
serde = { version = "1", features = ["derive"] } # You only need this if you want app persistence
whoami = "2.1.3"
local-ip-address = "0.6.13"
tracing = "0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3"

[profile.release]
opt-level = 2 # fast and small wasm
strip = true

[patch.crates-io]
